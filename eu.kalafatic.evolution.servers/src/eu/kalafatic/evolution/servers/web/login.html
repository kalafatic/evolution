<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log On to Evolution</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* UPM-standard login surface (tokens come from /css/style.css) */
        .login-shell { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--evo-bg); }
        .login-card { width: 420px; background: var(--evo-surface); border: 1px solid var(--evo-border-dark); border-radius: 7px; box-shadow: 0 8px 30px rgba(16,24,40,.18); overflow: hidden; }
        .login-head { display: flex; gap: 12px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--evo-border); }
        .login-mark { width: 9px; height: 9px; border-radius: 2px; background: var(--evo-primary); }
        .login-title { font-weight: 600; font-size: 14.5px; color: var(--evo-text); }
        .login-sub { color: var(--evo-text-muted); font-size: 11px; }
        .login-body { padding: 20px; }
        .login-body h2 { margin: 0 0 4px 0; font-size: 13px; font-weight: 600; color: var(--evo-text); }
        .login-body p { margin: 0 0 14px 0; font-size: 12px; color: var(--evo-text-secondary); }
        .field { margin-bottom: 10px; }
        .field label { display: block; color: var(--evo-text-secondary); font-size: 11px; margin-bottom: 3px; }
        .field input { width: 100%; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        #errorArea { color: var(--evo-danger); margin-bottom: 10px; font-size: 11px; height: 15px; text-align: center; }
        #loader { display: none; margin-top: 10px; text-align: center; font-size: 11px; color: var(--evo-text-muted); }
    </style>
</head>
<body class="login-shell">
    <div class="login-card">
        <div class="login-head">
            <span class="login-mark"></span>
            <div>
                <div class="login-title">Evolution</div>
                <div class="login-sub">Professional Intelligence Platform</div>
            </div>
        </div>
        <div class="login-body">
            <h2>Log On to Evolution</h2>
            <p>Enter your credentials to access the portal.</p>

            <div id="errorArea"></div>

            <form id="loginForm">
                <div class="field">
                    <label for="username">User name</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe" style="font-size: 11px;">Remember my credentials</label>
                </div>

                <div class="actions">
                    <button type="submit" id="loginBtn" style="min-width: 75px;">OK</button>
                    <button type="button" style="min-width: 75px;">Cancel</button>
                    <button type="button" style="min-width: 75px;">Options &gt;&gt;</button>
                </div>
            </form>

            <div id="loader">Verifying credentials...</div>
        </div>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
