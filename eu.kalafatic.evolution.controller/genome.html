<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genome Architecture Map</title>
    <script src="/auth-integration.js"></script>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="genome.css">
    <script>
        // Diagnostic JavaLog Bridge
        window.onerror = function(msg, url, line, col, error) {
            if (window.JavaLog) window.JavaLog('[JS Error] ' + msg + ' at ' + line + ':' + col);
            return false;
        };
    </script>
</head>
<body>
    <div id="layout">
        <div id="sidebar">
            <h1>🧬 Architecture</h1>

            <div class="sidebar-section">
                <h2>Target</h2>
                <div class="control-group">
                    <div style="display:flex; gap:5px;">
                        <select id="target-select" onchange="javaAction(this.value, 'SET_TARGET')" style="flex:1;">
                        </select>
                        <button class="btn btn-sm" onclick="javaAction('', 'BROWSE_TARGET')" style="width:auto;">📁</button>
                    </div>
                    <input type="text" id="target-path-input" style="width: 100%; margin-top: 2px;" placeholder="Target path..." onchange="javaAction(this.value, 'SET_TARGET')">
                    <button class="btn btn-primary" onclick="javaAction('', 'DISCOVER')">🔍 Discover Architecture</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h2>View</h2>
                <div class="control-group">
                    <select id="mode-select" onchange="javaAction(this.value, 'SET_VIEW_MODE')">
                        <option value="COMPONENTS">Components Map</option>
                        <option value="SUBSYSTEMS">Subsystems View</option>
                        <option value="USE_CASES">Use Cases Trace</option>
                        <option value="KNOWLEDGE_GRAPH">Knowledge Graph</option>
                        <option value="GENOME">Genome View</option>
                    </select>
                    <button class="btn" onclick="javaAction('', 'REFRESH')">🔄 Refresh View</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h2>Search & Filter</h2>
                <div class="control-group">
                    <input type="text" id="search-input" placeholder="Search nodes..." oninput="window.searchNodes(this.value)">
                    <select id="filter-type" onchange="window.filterNodes(this.value)">
                        <option value="ALL">All Categories</option>
                        <option value="CORE">Core</option>
                        <option value="VIEW">Architecture</option>
                        <option value="STORE">Knowledge</option>
                        <option value="BRIDGE">Integrations</option>
                        <option value="FLOW">Evolution</option>
                        <option value="DATA">Metadata</option>
                        <option value="LINK">Relationships</option>
                        <option value="SUB">Members</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: auto; font-size: 10px; opacity: 0.5;">
                <span>Evolution Genome Viewer v1.0.0</span>
            </div>
        </div>

        <div id="main-container">
            <div id="header">
                <div style="font-weight: 600; font-size: 14px;" id="project-title">Genome Visualizer</div>
                <div style="font-size: 11px; color: var(--evo-text-secondary);">Stored Module Viewer</div>
            </div>

            <div id="genome-container">
                <svg id="genome-svg">
                    <defs>
                        <marker id="arrowhead" viewBox="-0 -5 10 10" refX="20" refY="0" orient="auto" markerWidth="6" markerHeight="6" xoverflow="visible">
                            <path d="M 0,-5 L 10 ,0 L 0,5" fill="#999" style="stroke: none;"></path>
                        </marker>
                    </defs>
                </svg>

                <div id="zoom-controls">
                    <button class="zoom-btn" onclick="window.zoomIn()" title="Zoom In">+</button>
                    <button class="zoom-btn" onclick="window.zoomOut()" title="Zoom Out">−</button>
                    <button class="zoom-btn" onclick="window.resetZoom()" title="Reset Zoom">⊙</button>
                </div>

                <div id="empty-state">
                    <h1 style="font-size: 20px; margin-bottom: 10px;">No Genome Data</h1>
                    <p style="font-size: 0.9em;">Run <b>Update Genome</b> to generate genome data.</p>
                </div>

                <div id="details-panel">
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(msg) { if (window.logFunction) window.logFunction(msg); else console.log(msg); }
        function javaAction(id, action) { if (window.navigatorFunction) window.navigatorFunction(id, action); else log("Java action (Offline): " + id + " " + action); }

        window.INITIAL_GENOME = {{GENOME_JSON}};
        window.CURRENT_VIEW_MODE = {{VIEW_MODE_JSON}};
        window.TARGET_PATH = {{TARGET_PATH_JSON}};
        window.DEFAULT_PATH = {{DEFAULT_PATH_JSON}};
        window.TARGET_HISTORY = {{TARGET_HISTORY_JSON}};

        window.updateSidebar = function(data) {
            if (data.mode) {
                var modeSelect = document.getElementById('mode-select');
                if (modeSelect) modeSelect.value = data.mode;
            }
            if (data.target) {
                var targetInput = document.getElementById('target-path-input');
                if (targetInput) targetInput.value = data.target;
            }
            if (data.history) {
                var targetSelect = document.getElementById('target-select');
                if (targetSelect) {
                    targetSelect.innerHTML = '';
                    for (var i = 0; i < data.history.length; i++) {
                        var path = data.history[i];
                        var opt = document.createElement('option');
                        opt.value = path;
                        opt.text = (path === data.defaultTarget) ? "EVO (default): " + path : path;
                        if (path === data.target) opt.selected = true;
                        targetSelect.appendChild(opt);
                    }
                }
            }
        };

        window.onload = () => {
            log('ready');
            window.updateSidebar({
                mode: window.CURRENT_VIEW_MODE,
                target: window.TARGET_PATH,
                defaultTarget: window.DEFAULT_PATH,
                history: window.TARGET_HISTORY
            });
            if (window.updateGenome) {
                window.updateGenome(window.INITIAL_GENOME);
            }
        };
    </script>
    <script src="genome.js"></script>
</body>
</html>
