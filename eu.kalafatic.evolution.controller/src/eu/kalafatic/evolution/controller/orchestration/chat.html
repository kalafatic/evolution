<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--evo-bg, #f2f3f5);
            color: var(--evo-text, #202428);
            font-family: var(--evo-font-family, 'Segoe UI', sans-serif);
        }

        .progress-tabs {
            display: flex;
            border-bottom: 1px solid var(--evo-border, #c8ccd1);
            background: var(--evo-surface-alt, #f8f9fa);
            padding: 4px 10px 0 10px;
            gap: 4px;
        }
        .progress-tab {
            background: none;
            border: none;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--evo-text-secondary, #555b62);
            cursor: pointer;
            border-top-left-radius: var(--evo-radius, 3px);
            border-top-right-radius: var(--evo-radius, 3px);
            border: 1px solid transparent;
            border-bottom: none;
            margin-bottom: -1px;
        }
        .progress-tab:hover {
            color: var(--evo-text, #202428);
        }
        .progress-tab.active {
            background: var(--evo-surface, #ffffff);
            color: var(--evo-primary, #2864a5);
            border-color: var(--evo-border, #c8ccd1);
            border-bottom: 1px solid var(--evo-surface, #ffffff);
        }
        .tab-panel {
            font-family: var(--evo-font-family, sans-serif);
            font-size: 11px;
            color: var(--evo-text, #202428);
        }
        .training-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 11px;
        }
        .training-label {
            font-weight: bold;
            color: var(--evo-text-secondary, #555b62);
        }
        .log-container {
            font-family: var(--evo-font-mono, monospace);
            font-size: 10px;
            background: var(--evo-surface-alt, #f8f9fa);
            border: 1px solid var(--evo-border, #c8ccd1);
            border-radius: var(--evo-radius, 3px);
            padding: 6px;
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .log-entry {
            margin-bottom: 4px;
            word-break: break-all;
        }
        .log-entry.info { color: var(--evo-text, #202428); }
        .log-entry.success { color: var(--evo-success, #287a45); font-weight: bold; }
        .log-entry.warning { color: var(--evo-warning, #9a6a00); }
        .log-entry.error { color: var(--evo-danger, #a52a2a); font-weight: bold; }
    </style>

    <title>AI Evolution Chat</title>

    <link rel="stylesheet" href="shared.css">

    <script>
        window.onerror = function(msg, url, line, col, error) {
            if (window.JavaLog) window.JavaLog('[JS Error] ' + msg + ' at ' + line + ':' + col);
            return false;
        };

        window.hideLoading = function() {
            var overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.style.display = 'none';
        };
        setTimeout(window.hideLoading, 5000);
    </script>
</head>
<body class="full">
    <div id="loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--evo-surface, white); z-index: 9999; display: flex; align-items: center; justify-content: center; font-family: var(--evo-font-family, sans-serif); color: var(--evo-text-secondary, #555b62);">
        <div style="text-align: center;">
            <div>Initializing AI Intelligence...</div>
        </div>
    </div>

    <div id="chat-layout" style="display: flex; height: 100vh; width: 100vw; overflow: hidden;">
        <div id="main-content" style="flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden;">
            <div class='chat-container' id='chat' style="flex: 1; overflow-y: auto; padding: 8px;">
                <div id="messages-wrapper" style="display: flex; flex-direction: column; gap: 4px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
